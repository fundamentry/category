name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        type: choice
        required: true
        description: Semantic version
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  release:
    name: Release
    needs:
      - ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          fundamentry-token: ${{ secrets.FUNDAMENTRY_BOT_TOKEN }}

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v7
        id: gpg
        with:
          gpg_private_key: ${{ secrets.FUNDAMENTRY_BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.FUNDAMENTRY_BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true

      - name: Build
        run: pnpm build

      - name: Release
        run: pnpm nx release --yes --first-release ${{ inputs.version }}
        env:
          GH_TOKEN: ${{ secrets.FUNDAMENTRY_BOT_TOKEN }}

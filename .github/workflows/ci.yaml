name: CI

on:
  workflow_call:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          fundamentry-token: ${{ secrets.FUNDAMENTRY_BOT_TOKEN }}

      - name: Lint project
        run: pnpm lint

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          fundamentry-token: ${{ secrets.FUNDAMENTRY_BOT_TOKEN }}

      - name: Audit dependencies
        run: pnpm audit -prod --audit-level=moderate

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          fundamentry-token: ${{ secrets.FUNDAMENTRY_BOT_TOKEN }}

      - name: Build
        run: pnpm build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          fundamentry-token: ${{ secrets.FUNDAMENTRY_BOT_TOKEN }}

      - name: Test with coverage
        run: pnpm test:coverage

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-final
          path: coverage/coverage-final.json
          retention-days: 1

  quality:
    name: Quality
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          fundamentry-token: ${{ secrets.FUNDAMENTRY_BOT_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: coverage-final
          path: coverage

      - name: Qualify changes
        run: pnpm qualify --format github-annotations
